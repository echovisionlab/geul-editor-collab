name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: registry.dsub.io
  IMAGE_NAME: registry.dsub.io/echovisionlab/geul-editor-collab
  SERVICE_NAME: geul-editor-collab
  PLATFORMS: linux/amd64

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Create release PR or GitHub release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-image:
    name: Publish Image
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
      RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
      RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Validate release context
        id: release-context
        run: |
          set -euo pipefail

          if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag format: ${RELEASE_TAG}" >&2
            exit 1
          fi
          if [ "${RELEASE_TAG}" != "v${RELEASE_VERSION}" ]; then
            echo "Release tag ${RELEASE_TAG} does not match version ${RELEASE_VERSION}." >&2
            exit 1
          fi
          if ! [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release SHA must be a full 40-character commit SHA." >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "${RELEASE_SHA}" ]; then
            echo "Checked out $(git rev-parse HEAD), expected ${RELEASE_SHA}." >&2
            exit 1
          fi

          {
            echo "sha_image=${IMAGE_NAME}:sha-${RELEASE_SHA}"
            echo "tag_image=${IMAGE_NAME}:${RELEASE_TAG}"
            echo "created_at=$(git log -1 --format=%cI)"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate credentials
        env:
          HARBOR_REGISTRY_USERNAME: ${{ secrets.HARBOR_REGISTRY_USERNAME }}
          HARBOR_REGISTRY_PASSWORD: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          for var in HARBOR_REGISTRY_USERNAME HARBOR_REGISTRY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "Missing secret: ${var}" >&2
              exit 1
            fi
          done

      - name: Log in to Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_REGISTRY_USERNAME }}
          password: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}

      - name: Build and push release image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ steps.release-context.outputs.sha_image }}
            ${{ steps.release-context.outputs.tag_image }}
          labels: |
            org.opencontainers.image.created=${{ steps.release-context.outputs.created_at }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.ref.name=${{ env.RELEASE_TAG }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=${{ env.SERVICE_NAME }}
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}

      - name: Check published image digests
        env:
          EXPECTED_DIGEST: ${{ steps.image.outputs.digest }}
          SHA_IMAGE: ${{ steps.release-context.outputs.sha_image }}
          TAG_IMAGE: ${{ steps.release-context.outputs.tag_image }}
        run: |
          set -euo pipefail
          if ! [[ "${EXPECTED_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build did not return a valid image digest: ${EXPECTED_DIGEST}" >&2
            exit 1
          fi
          for image in "${SHA_IMAGE}" "${TAG_IMAGE}"; do
            actual_digest=""
            for attempt in $(seq 1 12); do
              if actual_digest="$(docker buildx imagetools inspect "${image}" --format '{{.Manifest.Digest}}' 2>/dev/null)" \
                && [ "${actual_digest}" = "${EXPECTED_DIGEST}" ]; then
                break
              fi
              if [ "${attempt}" -eq 12 ]; then
                echo "${image} resolved to ${actual_digest:-unavailable}, expected ${EXPECTED_DIGEST}." >&2
                exit 1
              fi
              sleep 5
            done
          done

      - name: Smoke published SHA image
        env:
          SHA_IMAGE: ${{ steps.release-context.outputs.sha_image }}
        run: |
          set -euo pipefail
          docker pull "${SHA_IMAGE}"
          docker run --rm --entrypoint /bin/sh "${SHA_IMAGE}" \
            -c 'test -s /app/package.json && test -s /app/dist/index.js && node --check /app/dist/index.js'
